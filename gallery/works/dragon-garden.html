let auto=false,night=false;document.getElementById('auto').onclick=e=>{auto=!auto;controls.autoRotate=auto;controls.autoRotateSpeed=.55;e.currentTarget.classList.toggle('active',auto)};document.getElementById('light').onclick=e=>{night=!night;e.currentTarget.classList.toggle('active',night);scene.background.set(night?0x071327:0x0b1e31);scene.fog.color.set(night?0x071327:0x0b1e31);sun.intensity=night?1.05:3.5;renderer.toneMappingExposure=night?1.25:1.65;fill.intensity=night?130:(collected===5?200:100)};document.getElementById('reset').onclick=()=>{camera.position.set(24,19,31);controls.target.set(0,2,0);controls.update()};document.getElementById('restart').onclick=()=>{collected=0;document.getElementById('count').textContent='0';for(const p of pearls){p.found=false;scene.add(p.group)}fill.color.set(0x75efff);fill.intensity=night?130:100;head.children.forEach(m=>m.material.emissive?.set(0x000000));toast('灵珠已归园 · 再来探索一次')};window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('loading').classList.add('hide');setTimeout(()=>document.getElementById('loading')?.remove(),900);const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let t=clock.getElapsedTime();for(let p of petals){p.m.position.y-=p.speed*.012;p.m.position.x+=Math.sin(t*.6+p.phase)*.002;p.m.rotation.y+=.002;if(p.m.position.y<.28)p.m.position.y=rr(7,10)}for(let p of pearls){if(!p.found){p.group.position.y=p.y+Math.sin(t*2+p.group.position.x)*.23;p.core.rotation.y=t*.8;p.core.rotation.z=t*.45}}controls.update();renderer.render(scene,camera)}animate();
