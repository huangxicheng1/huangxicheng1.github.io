<style>

<div id="grain"></div><div id="vignette"></div>
<header class="ui brand"><div class="brand-mark">桜<br>日</div><div><h1 class="brand-title">桜日和</h1><div class="brand-sub">Sakura Biyori · 水岸茶寮</div></div></header>

<div id="toast" role="status"></div><button id="enterPure">显示庭园界面 · H</button>
