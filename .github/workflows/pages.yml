name: Publish diary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # 构建与上传放在 build job；部署单独一个 job。
  # 原因：upload-pages-artifact 与 deploy-pages 在同一个 job 里连续执行时，
  # deploy-pages 查不到刚 finalize 的产物（间歇性 "No artifacts named github-pages"）。
  # 见 actions/deploy-pages#451、#305。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public content index
        run: python build.py
      - name: Prepare public files only
        run: |
          mkdir -p dist
          cp -r index.html calendar.html notes.html entry.html admin.html archive.css manifest.webmanifest icons 404.html openmanus-vs-claude-code.html claude-code-error-routing.html rag-three-approaches.html favicon.svg splash.css splash.js app.js entries.js annotate.css annotate.js toc.css toc.js edit.css edit.js assets annotations dog.gif dog-still.png logo.png favicon.ico apple-touch-icon.png games portal.css portal.js gallery todo vault dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
