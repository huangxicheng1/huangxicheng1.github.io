    /* 主题引导：全站统一使用主站的 'muse-theme' 记忆（'light'=夜间值班，'dark'/未设=纸色），
       事务科内部以 html[data-theme] 表达（'dark'=夜间），此处做边界翻译，避免首屏闪烁。 */
    (function () {
      try {
        var t = localStorage.getItem('muse-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
